[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    ; Install the pinned NimBLE first so Gamepad reuses it instead of fetching a newer version.
    https://github.com/h2zero/NimBLE-Arduino.git#2.3.1
    lemmingdev/ESP32-BLE-Gamepad@0.7.4
